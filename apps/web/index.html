<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5DEV — Build. Innovate. Grow.</title>
    <meta
      name="description"
      content="5DEV — développement web, solutions digitales, croissance digitale et photographie créative."
    />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link
      rel="preload"
      as="image"
      imagesrcset="/photos/accueil-conseil-900.webp 900w, /photos/accueil-conseil-1600.webp 1600w"
      imagesizes="(max-width: 1024px) 100vw, 46vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root">
      <!-- coque de démarrage : peinte immédiatement, remplacée par React au montage.
           Évite un écran blanc pendant le chargement du bundle. -->
      <div class="boot-shell" aria-hidden="true">
        <span class="boot-mark">5DEV<span class="boot-dot">.</span></span>
        <span class="boot-bar"></span>
      </div>
    </div>
    <style>
      .boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 18px;
        background: #faf8f5;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .boot-mark {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #171717;
        text-align: center;
      }
      .boot-dot { color: #f47721; }
      .boot-bar {
        display: block;
        width: 88px;
        height: 2px;
        margin: 0 auto;
        background: #e6e2dd;
        overflow: hidden;
        position: relative;
      }
      .boot-bar::after {
        content: '';
        position: absolute;
        inset-block: 0;
        width: 40%;
        background: #f47721;
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after { animation: none; transform: none; width: 100%; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
